name: ci

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  security-events: write

env:
  CI: true
  TZ: Asia/Tokyo
  DO_NOT_TRACK: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: microsoft/apm-action@64544310be26812256300543071bfbaa8bc93aad # v1
        id: apm
        with:
          audit-report: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && steps.apm.outputs.audit-report-path
        with:
          sarif_file: ${{ steps.apm.outputs.audit-report-path }}
          category: apm-audit
